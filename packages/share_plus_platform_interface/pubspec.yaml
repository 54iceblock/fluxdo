name: share_plus_platform_interface
description: A common platform interface for the share_plus plugin.
version: 6.1.0
homepage: https://github.com/fluttercommunity/plus_plugins
repository: https://github.com/fluttercommunity/plus_plugins/tree/main/packages/

dependencies:
  cross_file: ^0.3.3+4
  flutter:
    sdk: flutter
  meta: ^1.8.0
  mime: ">=1.0.4 <3.0.0"
  plugin_platform_interface: ^2.1.4
  # OHOS 移植（vendored 改动）：CPF fork 的原始 pubspec 这里是对
  # gitcode.com/openharmony-sig/flutter_packages (ref master) 的 git 依赖，
  # 会让每次 `flutter pub get` 额外克隆一个巨型仓库、且把 path_provider 变成
  # 第二种 source。FluxDO 本身已依赖官方 path_provider + path_provider_ohos，
  # 因此改回 hosted 约束即可，行为不变。
  path_provider: ^2.1.4
  uuid: ">=3.0.7 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0
  flutter_lints: ">=4.0.0 <6.0.0"
  test: ^1.22.0

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.3.0"
